name: Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release metadata
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content '.\src\CursorAI.BackupTool\CursorAI.BackupTool.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not read project version.'
          }

          $eventName = '${{ github.event_name }}'
          $gitRef = '${{ github.ref }}'
          $refName = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          $sha = '${{ github.sha }}'

          $shouldBuild = $eventName -eq 'pull_request'
          $shouldRelease = $false
          $tag = ''

          if ($eventName -eq 'push' -and $gitRef.StartsWith('refs/tags/v')) {
            $tag = $refName
            $expectedTag = "v$version"
            if ($tag -ne $expectedTag) {
              throw "Tag $tag does not match project version $version."
            }

            gh release view $tag --repo $repo *> $null
            if ($LASTEXITCODE -ne 0) {
              $shouldBuild = $true
              $shouldRelease = $true
            }
          }
          elseif ($eventName -eq 'push' -and $gitRef -eq 'refs/heads/main') {
            $tag = "v$version"

            gh release view $tag --repo $repo *> $null
            if ($LASTEXITCODE -ne 0) {
              gh api "repos/$repo/git/ref/tags/$tag" *> $null
              $tagExists = $LASTEXITCODE -eq 0

              $writeSucceeded = $false
              for ($attempt = 1; $attempt -le 2; $attempt++) {
                if ($tagExists) {
                  gh api --method PATCH "repos/$repo/git/refs/tags/$tag" -f sha=$sha -F force=true
                }
                else {
                  gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha=$sha
                }

                if ($LASTEXITCODE -eq 0) {
                  $writeSucceeded = $true
                  break
                }

                if ($attempt -lt 2) {
                  Start-Sleep -Seconds 2
                }
              }

              if (-not $writeSucceeded) {
                throw "Could not create or update release tag $tag."
              }

              $shouldBuild = $true
              $shouldRelease = $true
            }
          }

          "should_build=$($shouldBuild.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10
        if: steps.meta.outputs.should_build == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish framework-dependent single-file app
        if: steps.meta.outputs.should_build == 'true'
        shell: pwsh
        run: |
          dotnet publish .\src\CursorAI.BackupTool\CursorAI.BackupTool.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Build native runtime launcher
        if: steps.meta.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw 'Visual Studio C++ build tools were not found.'
          }

          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          $source = (Resolve-Path '.\src\CursorAI.BackupTool.Launcher\main.cpp').Path
          $outDir = Join-Path (Resolve-Path '.').Path 'launcher-build'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $output = Join-Path $outDir 'CursorAI.BackupTool.exe'

          @"
          @echo off
          call "$vcvars"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /O2 /DUNICODE /D_UNICODE "$source" /Fe:"$output" /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib
          "@ | Set-Content '.\build-launcher.cmd' -Encoding ASCII

          & cmd.exe /d /c '.\build-launcher.cmd'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if (-not (Test-Path $output)) {
            throw 'Launcher build did not produce CursorAI.BackupTool.exe.'
          }

      - name: Prepare release package
        if: steps.meta.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $publish = '.\src\CursorAI.BackupTool\bin\Release\net10.0-windows\win-x64\publish'
          $stage = '.\release-package'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $app = Join-Path $publish 'CursorAI.BackupTool.App.exe'
          if (-not (Test-Path $app)) {
            throw 'Published application executable was not found.'
          }

          Copy-Item '.\launcher-build\CursorAI.BackupTool.exe' "$stage\CursorAI.BackupTool.exe"
          Copy-Item $app "$stage\CursorAI.BackupTool.App.exe"
          Copy-Item '.\README.md' "$stage\README.md"
          if (Test-Path '.\LICENSE') {
            Copy-Item '.\LICENSE' "$stage\LICENSE"
          }

          Compress-Archive -Path "$stage\*" -DestinationPath '.\CursorAI.BackupTool-win-x64.zip' -Force

      - name: Verify package contents
        if: steps.meta.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $required = @(
            '.\release-package\CursorAI.BackupTool.exe',
            '.\release-package\CursorAI.BackupTool.App.exe',
            '.\release-package\README.md'
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing release file: $path"
            }
          }

          $size = (Get-Item '.\CursorAI.BackupTool-win-x64.zip').Length
          if ($size -le 0) {
            throw 'Release ZIP is empty.'
          }

      - name: Create GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.meta.outputs.tag }}'
          $repo = '${{ github.repository }}'

          $released = $false
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            gh release create $tag `
              '.\CursorAI.BackupTool-win-x64.zip' `
              --repo $repo `
              --title $tag `
              --generate-notes `
              --verify-tag

            if ($LASTEXITCODE -eq 0) {
              $released = $true
              break
            }

            if ($attempt -lt 2) {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $released) {
            throw "Could not create GitHub Release $tag."
          }
